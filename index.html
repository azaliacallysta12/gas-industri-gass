<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studi Kasus GIS & Industri Gas</title>

  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #17312b;
      line-height: 1.6;
    }

    /* NAVBAR */
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      border-bottom: 1px solid #ddd;
    }

    .nav-container {
      max-width: 1100px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #0b6b5c;
    }

    .nav-links {
      display: flex;
      gap: 18px;
    }

    .nav-links a {
      text-decoration: none;
      color: #333;
      font-size: 14px;
    }

    .nav-links a:hover {
      color: #0b6b5c;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #0b6b5c, #123d36);
      color: white;
      padding: 80px 20px;
    }

    .hero-container {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 40px;
      align-items: center;
    }

    .hero h1 {
      font-size: 48px;
      line-height: 1.1;
      margin: 20px 0;
    }

    .hero p {
      color: #e2f1ed;
      font-size: 17px;
    }

    .hero-card {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 30px;
      border-radius: 20px;
    }

    .hero-card strong {
      display: block;
      font-size: 40px;
    }

    /* SECTION */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 65px 20px;
    }

    .judul-kecil {
      color: #0f8a73;
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h2 {
      font-size: 32px;
      margin: 8px 0 20px;
    }

    h3 {
      margin-top: 0;
    }

    /* CARD */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      border: 1px solid #dce7e3;
      box-shadow: 0 10px 25px rgba(19,55,47,0.08);
    }

    .icon {
      width: 45px;
      height: 45px;
      background: #e5f3ef;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      margin-bottom: 15px;
    }

    /* CASE STUDY */
    .case {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .flow {
      display: grid;
      gap: 12px;
    }

    .flow-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #fafdfc;
      border: 1px solid #dce7e3;
      border-radius: 12px;
    }

    .flow-number {
      min-width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #0b6b5c;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    /* SKILLS */
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .skill {
      background: #edf6f3;
      color: #0b6b5c;
      padding: 8px 13px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    /* TAB */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid #ddd;
      background: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

      background: #0b6b5c;
      color: white;
